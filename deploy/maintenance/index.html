<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0A1925" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <title>TaxiFlow Pro - upgrade in progress</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: #0A1925;
        color: #FFFFFF;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      main {
        width: 100%;
        max-width: 440px;
        padding: 32px 24px;
        border-radius: 16px;
        background: #253947;
        text-align: center;
      }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { margin: 20px 0 8px; font-size: 1.5rem; }
      p { margin: 0 0 12px; line-height: 1.5; color: #E6ECF0; }
      .bar { height: 4px; margin: 24px auto 0; width: 96px; border-radius: 2px; background: linear-gradient(90deg, #FDB801, #F58801); }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/icon-192.png" alt="TaxiFlow Pro" />
      <h1>We are upgrading TaxiFlow Pro</h1>
      <p>TaxiFlow Pro is closed for a short, planned security upgrade. Your records are safe and nothing needs to be done on your side.</p>
      <p>Please check back later. Your TaxiFlow contact will let you know when it is open again.</p>
      <div class="bar" aria-hidden="true"></div>
    </main>
  </body>
</html>
